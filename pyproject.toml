[project]
name = "arxiv-classifier-api"
version = "0.1.0"
description = "Fine-tuned DistilBERT arXiv category classifier, served as an HTTP API"
requires-python = ">=3.11"
# Unpinned deliberately. These are the deps; `requirements.lock` is the exact
# resolution of them for the container — fully pinned and hashed, for linux
# x86_64, with CPU-only torch. Regenerate it with `make lock`, never by hand.
dependencies = [
    "torch",
    "transformers",
    "huggingface-hub",
    "fastapi",
    # Plain uvicorn, not uvicorn[standard]: the extras pull uvloop/httptools
    # which M4 would carry into the image for no measured gain.
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]  # httpx is what starlette's TestClient runs on

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# train.py ran once and produced the shipped artifact; it is committed for
# provenance, so lint churn there would tempt a refactor that makes the code
# stop describing how the live model was made.
extend-exclude = ["training/"]

[tool.ruff.lint]
# The scripts put src/ on sys.path before importing from it, which is what the
# `# noqa: E402` directives in them are for. Enabling the rule makes those
# directives mean something instead of reading as noise.
extend-select = ["E402"]
