[project]
name = "arxiv-classifier-api"
version = "0.1.0"
description = "Fine-tuned DistilBERT arXiv category classifier, served as an HTTP API"
requires-python = ">=3.11"
# Unpinned deliberately. requirements.lock (fully pinned, hashed) arrives at M4
# when the container needs reproducibility — see SPEC.md §8.
dependencies = [
    "torch",
    "transformers",
    "huggingface-hub",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
